[project]
name = "tourist-assistant"
version = "0.1.0"
description = "Asistente turístico de Tenerife: RAG + diálogo multiturno + function calling con LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-text-splitters",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
    "pypdf",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "tiktoken",
]

[project.optional-dependencies]
api = ["langchain-openai"]
ui = ["gradio>=6,<7"]
dev = ["ruff", "jupyter", "ipykernel", "matplotlib", "pandas", "markdown-it-py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tourist_assistant"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]  # se capturan excepciones genéricas a propósito: un fallo del modelo no debe tumbar el chat
